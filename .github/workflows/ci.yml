name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码风格
        run: ruff check reviewbot tests
      - name: 单元测试
        # 测试全部使用替身（FakeRedis / httpx.MockTransport），
        # 因此 CI 不需要 Redis 服务，也不会调用任何外部 API
        run: python -m pytest -q
      - name: CLI 冒烟测试
        run: |
          python -m reviewbot.cli analyze reviewbot/analysis/metrics.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t code-review-bot:ci .
      - name: 镜像自检（无依赖启动到健康检查失败为止）
        run: docker run --rm code-review-bot:ci python -m reviewbot.cli --help
