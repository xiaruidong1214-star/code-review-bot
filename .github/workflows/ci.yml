name: CI

on:
  push:
    # 只对主分支与版本标签跑完整 CI：`["**"]` 会让每次临时分支推送都占用
    # 完整矩阵（含 docker build），在按分钟计费的场景下是纯浪费。
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码风格
        run: ruff check reviewbot tests
      - name: 单元测试
        # 测试全部使用替身（FakeRedis / httpx.MockTransport），
        # 因此 CI 不需要 Redis 服务，也不会调用任何外部 API
        run: python -m pytest -q
      - name: 依赖安全审计
        # 只审计声明依赖，不需要可编辑安装；CVE 会随时间变化，
        # 因此这一步是"随时间变化的信号"，失败时先看是不是新披露的漏洞。
        run: |
          python -m pip install pip-audit
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          req = pathlib.Path("audit-requirements.txt")
          req.write_text("\n".join(data["project"]["dependencies"]), encoding="utf-8")
          sys.exit(subprocess.run(
              [sys.executable, "-m", "pip_audit", "-r", str(req), "--progress-spinner", "off"]
          ).returncode)
          PY
      - name: CLI 冒烟测试
        run: |
          python -m reviewbot.cli analyze reviewbot/analysis/metrics.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t code-review-bot:ci .
      - name: 镜像自检（无依赖启动到健康检查失败为止）
        run: docker run --rm code-review-bot:ci python -m reviewbot.cli --help
